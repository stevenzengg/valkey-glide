definitions:
  caches:
    gradle-cache:
      key:
        files:
          - build.gradle
          - gradle.properties
      path: ~/.gradle/caches
    gradle-wrapper:
      key:
        files:
          - gradle/wrapper/gradle-wrapper.properties
      path: ~/.gradle/wrapper
  steps:
    publishToArtifactory: &publishToArtifactory
      image: "atlassian/default-image:5"
      size: 4x
      caches:
        - gradle-cache
        - gradle-wrapper
      runtime:
        cloud:
          instance-type: "standard"
      name: Publish To Artifactory
      script:
        - pipe: docker://atlassian/artifactory-sidekick:latest
        - source .artifactory/activate.sh
        - cd java
        - ./gradlew publish
    build: &build
      image: "atlassian/default-image:5"
      size: 4x
      caches:
        - gradle-cache
        - gradle-wrapper
      runtime:
        cloud:
          instance-type: "standard"
      name: Build
      script:
        - pipe: docker://atlassian/artifactory-sidekick:latest
        - source .artifactory/activate.sh
        - cd java
        - ./gradlew build
pipelines:
  default:
    - step: *build
  custom:
    manual-publish-to-artifactory:
      - step: *publishToArtifactory
  pull-requests:
    main:
      - step: *build
  branches:
    main:
      - step: *publishToArtifactory

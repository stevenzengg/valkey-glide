definitions:
  steps:
    publishToArtifactory: &publishToArtifactory
      size: 4x
      runtime:
        cloud:
          instance-type: "standard"
      name: Publish To Artifactory
      script:
        - pipe: docker://atlassian/artifactory-sidekick:latest
        - source .artifactory/activate.sh
        - ./gradlew publish
    build: &build
      size: 4x
      runtime:
        cloud:
          instance-type: "standard"
      name: Build
      script:
        - pipe: docker://atlassian/artifactory-sidekick:latest
        - source .artifactory/activate.sh
        - ./gradlew build
pipelines:
  default:
    - step: *publishToArtifactory
  custom:
    # =========================================================================
    # Cluster Controller Only Pipeline
    # Use this for changes that only affect cluster-controller/ directory
    # This is significantly faster as it skips Rust compilation
    # =========================================================================
    deploy-cluster-controller-staging:
      - step: *publishToArtifactory

  pull-requests:
    # PRs targeting main (release PRs) - run validation only
    main:
      - step: *build

  branches:
    # Merges to main (production releases) - validate, build, deploy to staging/canary, then manual deploy to production
    main:
      - step: *publishToArtifactory

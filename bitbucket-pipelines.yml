definitions:
  steps:
    publishToArtifactory: &publishToArtifactory
      image: "atlassian/default-image:5"
      size: 4x
      runtime:
        cloud:
          instance-type: "standard"
      name: Publish To Artifactory
      script:
        - pipe: docker://atlassian/artifactory-sidekick:latest
        - source .artifactory/activate.sh
        - cd java
        - apt update -y
        - apt install -y openjdk-21-jdk git gcc pkg-config openssl libssl-dev unzip cmake valkey python3-pip python3.12-venv
        - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        - source "$HOME/.cargo/env"
        - curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v29.1/protoc-29.1-linux-x86_64.zip
        - unzip protoc-29.1-linux-x86_64.zip -d /usr/local
        - python3 -m venv .venv
        - . .venv/bin/activate
        - pip3 install --upgrade pip
        - pip3 install ziglang
        - cargo install --locked cargo-zigbuild
        - ./gradlew publish
    build: &build
      image: "atlassian/default-image:5"
      size: 4x
      runtime:
        cloud:
          instance-type: "standard"
      name: Build
      script:
        - pipe: docker://atlassian/artifactory-sidekick:latest
        - source .artifactory/activate.sh
        - cd java
        - apt update -y
        - apt install -y openjdk-21-jdk git gcc pkg-config openssl libssl-dev unzip cmake valkey python3-pip python3.12-venv
        - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        - source "$HOME/.cargo/env"
        - curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v29.1/protoc-29.1-linux-x86_64.zip
        - unzip protoc-29.1-linux-x86_64.zip -d /usr/local
        - python3 -m venv .venv
        - . .venv/bin/activate
        - pip3 install --upgrade pip
        - pip3 install ziglang
        - cargo install --locked cargo-zigbuild
        - ./gradlew build
pipelines:
  default:
    - step: *build
  custom:
    manual-publish-to-artifactory:
      - step: *publishToArtifactory
  pull-requests:
    main:
      - step: *build
  branches:
    main:
      - step: *publishToArtifactory
